modLoader = "javafml"
loaderVersion = "[3,)"
issueTrackerURL = "https://discord.gg/enginehub"
license = "GPLv3"

[[mods]]
modId = "worldedit"
# The worldedit version itself stays WorldEdit's: WorldEditCUI and other mods check it.
version = "${version}"
displayName = "SurvivalEdit ${survivalVersion}"
displayURL = "https://enginehub.org/worldedit/"
description = '''
WorldEdit tuned for survival play: edits are paid for out of an Applied Energistics 2 network and are
applied gradually so large edits do not stall the server.
'''
authors = "EngineHub, SurvivalEdit"
logoFile = "worldedit-icon.png"
displayTest = "IGNORE_SERVER_VERSION"

[[mixins]]
config = "worldedit-neoforge.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.worldedit]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraftVersion},${nextMajorMinecraftVersion})"
ordering = "NONE"
side = "BOTH"

[[dependencies.worldedit]]
modId = "neoforge"
type = "required"
# Not ${neoVersion}: the dev build must not bake in the exact NeoForge it was compiled
# against, or every pack older than that dev build refuses the mod.
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.worldedit]]
modId = "ae2"
type = "required"
versionRange = "[19.2.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.worldedit]]
modId = "ae2wtlib"
type = "required"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.worldedit]]
modId = "curios"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.worldedit]]
modId = "modmenu"
type = "optional"
versionRange = "[7.0.0,)"
ordering = "AFTER"
side = "CLIENT"
