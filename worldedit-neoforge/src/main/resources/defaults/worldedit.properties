#Don't put comments; they get removed

# SurvivalEdit config.
# This is WorldEdit trimmed and modified to work in survival through an ME system
# with a wireless terminal. If you want normal WorldEdit in creative, install that instead.

# Logs
log-file=worldedit.log
log-format=[%1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS %4$s]: %5$s%6$s%n

# How many blocks all edits together may write per server tick. Large edits are spread over
# several ticks, so this is the main cost knob. 1024 is a good default on a normal server.
survival.blocks-per-tick=1024

# Milliseconds to wait before writing into the next chunk. 0 applies as fast as the tick allows;
# raise it if large edits make the server stutter.
survival.per-chunk-delay-ms=0

# The largest edit a player may make at once, in blocks. 0 removes the limit.
survival.max-blocks-per-edit=250000

# How many edits are kept per player on disk, for //undo and //redo. 0 keeps everything.
survival.history-limit=250

# Allow //schem and the clipboard save/load commands in survival. They cost no items, so this is
# off by default; schematics are how an edit would get around paying for blocks.
survival.allow-schematics=false

# When an undo or a redo returns items and they fit neither the ME network nor the inventory,
# drop them on the ground (true) or discard them (false).
survival.drop-if-network-is-full=true

# Blocks a survival edit may not overwrite. Only the block that is already in the world can be
# protected, so a build may go next to one of these but never over it. The whole edit is refused
# before anything is paid for; creative-mode edits are not restricted.
#
# Three forms are accepted:
#   minecraft:bedrock   one block
#   @ae2                every block of a mod (ae2:* works too)
#   #minecraft:logs     every block in a block tag
#   !ae2:controller     an exception: this block stays editable even though a rule above it
#                       would protect it (for example @ae2,!ae2:controller). An exception
#                       always wins, wherever it is in the list.
survival.protected-blocks=minecraft:bedrock,minecraft:barrier,minecraft:command_block,minecraft:chain_command_block,minecraft:repeating_command_block,minecraft:structure_block,minecraft:structure_void,minecraft:jigsaw,minecraft:spawner,minecraft:trial_spawner,minecraft:vault,minecraft:end_portal,minecraft:end_portal_frame,minecraft:end_gateway,minecraft:nether_portal,minecraft:dragon_egg,minecraft:reinforced_deepslate,minecraft:budding_amethyst,minecraft:heavy_core,minecraft:beacon,minecraft:conduit,minecraft:respawn_anchor,minecraft:lodestone,minecraft:enchanting_table,minecraft:netherite_block,minecraft:chest,minecraft:trapped_chest,minecraft:barrel,minecraft:ender_chest,minecraft:shulker_box,ae2:controller,ae2:drive,ae2:chest,ae2:energy_acceptor,ae2:energy_cell,ae2:dense_energy_cell,ae2:spatial_io_port,ae2:spatial_pylon,ae2:quantum_ring,ae2:quantum_link,ae2:security_station,ae2:wireless_access_point,ae2:pattern_provider,ae2:interface,ae2:molecular_assembler,ae2:inscriber,ae2:crafting_unit,mekanism:digital_miner,mekanism:quantum_entangloporter,mekanism:teleporter,mekanism:antiprotonic_nucleosynthesizer,mekanism:fusion_reactor_controller,mekanism:supercharged_coil,mekanism:sps,allthemodium:allthemodium_block,allthemodium:vibranium_block,allthemodium:unobtainium_block

